name: Go SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdks/go/**"
      - "spec/**"
  pull_request:
    paths:
      - "sdks/go/**"
      - "spec/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build/Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdks/go
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod
          check-latest: true
          cache: true

      - name: Setup Python
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install pytest
          pip install -e sdks/py

      # --- Build + Vet ---

      - name: Build (all modules)
        shell: pwsh
        run: |
          $modules = @(".", "src/middleware", "src/integrations", "bench", "tests/integration")
          foreach ($module in $modules) {
            Push-Location $module
            go build ./...
            Pop-Location
          }

      - name: Vet (all modules)
        shell: pwsh
        run: |
          $modules = @(".", "src/middleware", "src/integrations", "bench", "tests/integration")
          foreach ($module in $modules) {
            Push-Location $module
            go vet ./...
            Pop-Location
          }

      # --- Lint ---

      - name: Install golangci-lint
        if: matrix.os == 'ubuntu-latest'
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: $(go env GOPATH)/bin/golangci-lint run

      # --- Tests ---

      - name: Tests (all modules)
        shell: pwsh
        run: |
          $modules = @(".", "src/middleware", "src/integrations", "bench", "tests/integration")
          foreach ($module in $modules) {
            Push-Location $module
            go test ./... -count=1 -race
            Pop-Location
          }

      # --- Conformance ---

      - name: Conformance tests
        if: matrix.os == 'ubuntu-latest'
        working-directory: spec
        run: python conformance/runner.py --sdk go --group all

      # --- Vulnerability check ---

      - name: Install govulncheck
        if: matrix.os == 'ubuntu-latest'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Vulnerability check
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          $govuln = Join-Path (go env GOPATH) "bin/govulncheck"
          $modules = @(".", "src/middleware", "src/integrations", "src/sinks")
          foreach ($module in $modules) {
            Push-Location $module
            & $govuln ./...
            Pop-Location
          }

      # --- Stress tests ---

      - name: Stress tests
        working-directory: sdks/go/tests/integration
        run: go test ./... -run "TestAsyncPipelineDrain|TestAsyncPipelineNoLossConcurrent|TestConfigureDrainsPreviousLogger" -count=10

      # --- Benchmarks ---

      - name: Benchmarks
        working-directory: sdks/go/bench
        run: go test ./... -run ^$ -bench . -count=1

  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    if: always()
    needs: [build-test]
    steps:
      - name: Enforce job success
        shell: pwsh
        run: |
          if ("${{ needs.build-test.result }}" -ne "success") {
            throw "build-test: ${{ needs.build-test.result }}"
          }
