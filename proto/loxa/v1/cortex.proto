syntax = "proto3";

package loxa.v1;

option go_package = "github.com/astraive/loxa/gen/go/loxa/v1;loxav1";

import "google/protobuf/timestamp.proto";
import "loxa/v1/event.proto";

service CortexService {
  rpc Healthz(HealthzRequest) returns (HealthzResponse);
  rpc IngestEvent(IngestEventRequest) returns (IngestEventResponse);
  rpc IngestBatch(IngestBatchRequest) returns (IngestBatchResponse);
  rpc Reconstruct(ReconstructRequest) returns (ReconstructResponse);
  rpc GetGraph(GetGraphRequest) returns (GetGraphResponse);
  rpc RecordFeedback(RecordFeedbackRequest) returns (RecordFeedbackResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
  rpc QueryLifecycle(QueryLifecycleRequest) returns (QueryLifecycleResponse);
}

message HealthzRequest {}

message HealthzResponse {
  string status = 1;
}

// Use the full Event proto from event.proto for lifecycle-aware ingestion
message IngestEventRequest {
  Event event = 1;
}

message IngestEventResponse {
  string status = 1;
  string event_id = 2;
  repeated string warnings = 3;
}

message IngestBatchRequest {
  repeated Event events = 1;
}

message IngestBatchResponse {
  string status = 1;
  int32 count = 2;
  repeated string warnings = 3;
}

message ReconstructRequest {
  string incident_id = 1;
  string mode = 2;
}

message GraphNode {
  string id = 1;
  string service = 2;
  string node_type = 3;
}

message GraphEdge {
  string from = 1;
  string to = 2;
  string edge_type = 3;
}

message ReconstructResponse {
  string incident_id = 1;
  string status = 2;
  string severity = 3;
  string primary_service = 4;
  repeated string affected_services = 5;
  repeated GraphNode nodes = 6;
  repeated GraphEdge edges = 7;
}

message GetGraphRequest {
  string service = 1;
  string incident_id = 2;
  int32 depth = 3;
}

message GetGraphResponse {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
}

message RecordFeedbackRequest {
  string incident_id = 1;
  string remediation_id = 2;
  bool success = 3;
  string notes = 4;
}

message RecordFeedbackResponse {
  string status = 1;
}

message StreamEventsRequest {
  string incident_id = 1;
  string service_filter = 2;
  string event_filter = 3;
  string outcome_filter = 4;
}

// Lifecycle-aware query support
message QueryLifecycleRequest {
  string event_id = 1;
  string trace_id = 2;
  string service = 3;
  int32 limit = 4;
  int32 offset = 5;
  google.protobuf.Timestamp from = 6;
  google.protobuf.Timestamp to = 7;
}

message LifecycleSummary {
  string event_id = 1;
  string event = 2;
  string service = 3;
  string outcome = 4;
  double duration_ms = 5;
  int32 checkpoint_count = 6;
  int32 process_count = 7;
  int32 group_count = 8;
  int32 timer_count = 9;
  int32 link_count = 10;
  string trace_id = 11;
}

message QueryLifecycleResponse {
  repeated LifecycleSummary summaries = 1;
  int32 total = 2;
}
