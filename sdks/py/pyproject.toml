[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loxa"
version = "1.0.0"
description = "Python LOXA wide-event SDK"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Astraive"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["loxa*"]

[tool.setuptools.package-data]
loxa = ["py.typed"]
