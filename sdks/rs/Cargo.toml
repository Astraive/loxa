[package]
name = "loza"
version = "0.2.6"
edition = "2021"
description = "Rust LOZA wide-event SDK"
license = "MIT"
repository = "https://github.com/Astraive/loza"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting", "parsing"] }
fastrand = "2"
flate2 = "1"
ureq = { version = "2", features = ["gzip", "json"] }
regex = "1"
sha2 = "0.10"
base64 = "0.22"
hostname = "0.4"
futures-util = { version = "0.3", optional = true }
actix-web = { version = "4", optional = true }
axum = { version = "0.7", optional = true }
tower = { version = "0.4", optional = true }
hyper = { version = "1", optional = true }

[features]
default = []
actix = ["dep:actix-web", "dep:futures-util"]
axum = ["dep:axum", "dep:tower", "dep:hyper"]
