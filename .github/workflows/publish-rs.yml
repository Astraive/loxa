name: Publish Rust

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish-sdk:
    if: inputs.component == 'sdk-rs'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyyaml
        working-directory: .
      - run: python scripts/release/validate-manifests.py --component sdk-rs
        working-directory: .
      - run: cargo test --all-features
      - run: cargo package
      - name: Check component tag is available
        run: python scripts/release/tag-component.py sdk-rs --dry-run
        working-directory: .
      - name: Publish crate
        if: inputs.dry_run != true
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Create component tag
        if: inputs.dry_run != true
        run: python scripts/release/tag-component.py sdk-rs --push
        working-directory: .
