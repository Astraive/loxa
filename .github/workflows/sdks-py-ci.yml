name: Python SDK CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: pytest
      - run: pytest tests/test_spec_conformance.py tests/test_collector_ack_fixture.py tests/test_emitted_shape_fixture.py tests/test_parity.py
      - name: Grouped conformance
        working-directory: spec
        run: python conformance/runner.py --sdk python --group all
