name: JS SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdks/js/**"
      - "spec/**"
      - ".github/workflows/sdks-js.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/js/**"
      - "spec/**"
      - ".github/workflows/sdks-js.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/js

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Tests
        run: bun run test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install conformance dependencies
        working-directory: .
        run: |
          pip install pytest
          pip install -e sdks/py

      - name: Run grouped conformance
        working-directory: spec
        run: python conformance/runner.py --sdk javascript --group all
