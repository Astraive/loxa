apiVersion: apps/v1
kind: Deployment
metadata:
  name: loza-collector
  labels:
    app.kubernetes.io/name: loza-collector
    app.kubernetes.io/component: collector
spec:
  # DuckDB state is pod-local; scale only after configuring a supported shared backend.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loza-collector
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loza-collector
        app.kubernetes.io/component: collector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: collector
          image: ghcr.io/astraive/loza:0.3.2
          securityContext:
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          args:
            - run
            - -c
            - /etc/loza/config.yaml
          ports:
            - name: http
              containerPort: 9308
              protocol: TCP
          env:
            - name: COLLECTOR_AUTH_SERVER_SECRET
              valueFrom:
                secretKeyRef:
                  name: loza-collector-secrets
                  key: auth-server-secret
            - name: COLLECTOR_INGEST_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: loza-collector-secrets
                  key: ingest-key-secret
            - name: COLLECTOR_ADMIN_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: loza-collector-secrets
                  key: admin-key-secret
            - name: LOZA_STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: loza-collector-secrets
                  key: storage-encryption-key
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/loza
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: loza-collector-config
        - name: data
          emptyDir: {}
