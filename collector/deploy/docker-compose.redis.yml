# Loza Collector — Redis Streams eventbus (simple self-hosted)
# Usage: docker compose -f docker-compose.redis.yml up
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  collector:
    build:
      context: ../..
      dockerfile: collector/deploy/Dockerfile.collector
    command: ["./loza-collector", "run", "-c", "/app/build/loza-collector.yaml"]
    ports:
      - "9308:9308"
    volumes:
      - ../../:/app
    environment:
      LOZA_EVENTBUS: redis
      LOZA_EVENTBUS_TOPIC: loza.events.raw
      LOZA_EVENTBUS_GROUP: loza-worker
      LOZA_EVENTBUS_REDIS_ADDR: redis:6379
      COLLECTOR_RELIABILITY_MODE: queue
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: collector/deploy/Dockerfile.collector
    command: ["./loza-worker", "run", "-c", "/app/build/loza-collector.yaml"]
    volumes:
      - ../../:/app
    environment:
      LOZA_EVENTBUS: redis
      LOZA_EVENTBUS_TOPIC: loza.events.raw
      LOZA_EVENTBUS_GROUP: loza-worker
      LOZA_EVENTBUS_REDIS_ADDR: redis:6379
      COLLECTOR_RELIABILITY_MODE: queue
    depends_on:
      redis:
        condition: service_healthy

  sample-app:
    image: curlimages/curl:8.12.1
    depends_on:
      - collector
    volumes:
      - ../build:/payload
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 5
        curl -sS -X POST http://collector:9308/ingest \
          --data-binary @/payload/sample-events.ndjson \
          -H "Content-Type: application/x-ndjson"

volumes:
  redis-data:
