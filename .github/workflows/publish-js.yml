name: Publish JS

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  publish:
    if: inputs.component == 'sdk-js'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install pyyaml
        working-directory: .

      - run: python scripts/release/validate-manifests.py --component sdk-js
        working-directory: .

      - name: Enforce Bun package identity
        run: |
          test "$(bun -e "console.log((await Bun.file('package.json').json()).name)")" = "@astraive/loza"
          test "$(bun -e "console.log((await Bun.file('package.json').json()).version)")" = "${{ inputs.version }}"

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test

      - name: Check component tag is available
        run: python scripts/release/tag-component.py sdk-js --dry-run
        working-directory: .

      - name: Validate npm credentials
        if: inputs.dry_run != true
        run: test -n "$NPM_CONFIG_TOKEN"
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish package
        if: inputs.dry_run != true
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack package
        if: inputs.dry_run == true
        run: bun pm pack

      - name: Create component tag
        if: inputs.dry_run != true
        run: python scripts/release/tag-component.py sdk-js --push
        working-directory: .
