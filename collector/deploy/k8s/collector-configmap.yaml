apiVersion: v1
kind: ConfigMap
metadata:
  name: loxa-collector-config
  labels:
    app.kubernetes.io/name: loxa-collector
    app.kubernetes.io/component: collector
data:
  config.yaml: |
    collector:
      addr: ":9308"
      read_header_timeout: 5s
      shutdown_timeout: 10s
      max_body_bytes: 10485760
      max_events_per_request: 5000

    auth:
      enabled: true
      header: X-API-Key
      value_env: COLLECTOR_API_KEY

    rate_limit:
      enabled: true
      rps: 1000
      burst: 1000

    routes:
      ingest: /ingest
      health: /healthz
      ready: /readyz
      metrics: /metrics

    storage:
      primary: duckdb
      encryption_key_env: LOXA_STORAGE_ENCRYPTION_KEY

    duckdb:
      path: /data/loxa.db
      store_raw: true
      checkpoint_on_shutdown: true

    logging:
      level: info
      format: json

    metrics:
      prometheus: true

    privacy:
      mode: warn

    schema_governance:
      mode: off
