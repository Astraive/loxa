[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loza"
version = "0.3.0"
description = "Python LOZA wide-event SDK"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Astraive"}]
dependencies = []

[tool.coverage.run]
branch = true
source = ["src/loza"]
omit = [
    "*/generated/*",
    "src/loza/generated/*",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
omit = [
    "*/generated/*",
    "src/loza/generated/*",
]

[tool.setuptools]
py-modules = ["loza_contract"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["loza*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "F401"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.setuptools.package-data]
loza = ["py.typed", "loza-py.defaults.yaml"]
