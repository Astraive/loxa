name: Publish JS

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  publish:
    if: inputs.component == 'sdk-js'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install pyyaml
        working-directory: .

      - run: python scripts/release/validate-manifests.py --component sdk-js
        working-directory: .

      - name: Enforce Bun package identity
        run: |
          test "$(bun -e "console.log((await Bun.file('package.json').json()).name)")" = "@astraive/loza"
          test "$(bun -e "console.log((await Bun.file('package.json').json()).version)")" = "${{ inputs.version }}"

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test

      - name: Check component tag is available
        run: python scripts/release/tag-component.py sdk-js --dry-run
        working-directory: .

      - name: Install OIDC-capable npm
        run: npm install --global npm@12.0.2

      - name: Publish package
        if: inputs.dry_run != true
        run: npm publish --access public

      - name: Validate package archive
        if: inputs.dry_run == true
        run: npm pack --dry-run

      - name: Create component tag
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python scripts/release/tag-component.py sdk-js --dry-run)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}"
        working-directory: .
