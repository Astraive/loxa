name: Collector CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collector-ci.yml"
      - "collector/**"
      - "spec/**"
      - "proto/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/collector-ci.yml"
      - "collector/**"
      - "spec/**"
      - "proto/**"

permissions:
  contents: read

jobs:
  proto-sync:
    name: Check proto files are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install protoc
        run: |
          PROTOC_VERSION=34.1
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -o /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          rm /tmp/protoc.zip

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Regenerate proto and check diff
        run: |
          make proto
          make check-proto

  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    needs: [proto-sync]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod

      - name: Install protoc
        run: |
          PROTOC_VERSION=34.1
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -o /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          rm /tmp/protoc.zip

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Generate protobuf code
        working-directory: .
        run: make proto

      - name: Run unit tests
        run: go test ./...
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    needs: [proto-sync]
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 0
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_ADVERTISED_LISTENERS: CONTROLLER://localhost:9093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 0@127.0.0.1:9093
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: loza
          POSTGRES_PASSWORD: loza
          POSTGRES_DB: loza
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_DB: loza
          CLICKHOUSE_USER: loza
          CLICKHOUSE_PASSWORD: loza
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for PostgreSQL and ClickHouse
        run: |
          for service in "127.0.0.1 5432" "127.0.0.1 9000"; do
            set -- $service
            for attempt in $(seq 1 30); do
              (echo > /dev/tcp/$1/$2) >/dev/null 2>&1 && break
              sleep 2
            done
            (echo > /dev/tcp/$1/$2) >/dev/null 2>&1 || exit 1
          done

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod

      - name: Install protoc
        run: |
          PROTOC_VERSION=34.1
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -o /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          rm /tmp/protoc.zip

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Generate protobuf code
        working-directory: .
        run: make proto

      - name: Run database, queue, and Redis integration tests
        env:
          LOZA_TEST_POSTGRES_USER: loza
          LOZA_TEST_POSTGRES_PASSWORD: loza
          LOZA_TEST_POSTGRES_HOST: 127.0.0.1
          LOZA_TEST_POSTGRES_PORT: 5432
          LOZA_TEST_POSTGRES_DATABASE: loza
          LOZA_TEST_POSTGRES_SSLMODE: disable
          LOZA_TEST_CLICKHOUSE_USER: loza
          LOZA_TEST_CLICKHOUSE_PASSWORD: loza
          LOZA_TEST_CLICKHOUSE_HOSTS: 127.0.0.1:9000
          LOZA_TEST_CLICKHOUSE_DATABASE: loza
        run: go test -tags=integration -run 'TestCollectorIntegration_|TestNamedDatabaseConnectionsRoundTrip' ./cmd/loza-collector
