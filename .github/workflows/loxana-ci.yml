name: Loxana CI

on:
  push:
    branches: [main]
    paths:
      - "loxana/**"
      - ".github/workflows/loxana-ci.yml"
  pull_request:
    paths:
      - "loxana/**"
      - ".github/workflows/loxana-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loxana

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run tsc -b

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
