name: DuckDB Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bench:
    name: DuckDB benchmark matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod

      - name: Run DuckDB benchmarks (Go)
        working-directory: ./collector
        run: |
          go test ./internal/sinks/duckdb -run "^$" -bench . -benchmem > duckdb_bench.txt

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-bench
          path: collector/duckdb_bench.txt
