{{- if .Values.collector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loxa.fullname" . }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loxa.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  replicas: {{ .Values.collector.replicaCount }}
  selector:
    matchLabels:
      {{- include "loxa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collector
  template:
    metadata:
      {{- with .Values.collector.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "loxa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: collector
        {{- with .Values.collector.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "loxa.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: collector
          image: {{ include "loxa.collector.image" . }}
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["loxa-collector"]
          args: ["run", "-c", "/app/config/config.yaml"]
          ports:
            - name: http
              containerPort: 9308
              protocol: TCP
            - name: metrics
              containerPort: 9308
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.collector.config.routes.health | quote }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: {{ .Values.collector.config.routes.health | quote }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          env:
            - name: COLLECTOR_AUTH_SERVER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "collector.security.existingSecret is required when collector.enabled is true" .Values.collector.security.existingSecret }}
                  key: {{ .Values.collector.security.authServerSecretKey }}
            - name: COLLECTOR_INGEST_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "collector.security.existingSecret is required when collector.enabled is true" .Values.collector.security.existingSecret }}
                  key: {{ .Values.collector.security.ingestKeySecretKey }}
            - name: COLLECTOR_ADMIN_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "collector.security.existingSecret is required when collector.enabled is true" .Values.collector.security.existingSecret }}
                  key: {{ .Values.collector.security.adminKeySecretKey }}
            - name: LOXA_STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "collector.security.existingSecret is required when collector.enabled is true" .Values.collector.security.existingSecret }}
                  key: {{ .Values.collector.security.storageEncryptionKey }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ include "loxa.fullname" . }}-collector-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-collector" (include "loxa.fullname" .)) .Values.persistence.collector.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}