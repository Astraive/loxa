name: Publish Rust

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  publish-sdk:
    if: inputs.component == 'sdk-rs'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyyaml
        working-directory: .
      - run: python scripts/release/validate-manifests.py --component sdk-rs
        working-directory: .
      - run: cargo test --all-features
      - run: cargo package
      - name: Check component tag is available
        run: python scripts/release/tag-component.py sdk-rs --dry-run
        working-directory: .

      - name: Authenticate with crates.io
        if: inputs.dry_run != true
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        if: inputs.dry_run != true
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

      - name: Create component tag
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python scripts/release/tag-component.py sdk-rs --dry-run)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}"
        working-directory: .
