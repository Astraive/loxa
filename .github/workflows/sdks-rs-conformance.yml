name: Rust SDK Conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run conformance tests
        working-directory: spec
        run: python conformance/runner.py --sdk rust --group all

      - name: Run spec contract tests
        run: cargo test --test spec_contract_test --test conformance_fixtures --test ingest_envelope_fixture
