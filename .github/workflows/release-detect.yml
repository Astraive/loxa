name: Release Detect

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  detect:
    name: Validate manifests and detect version bumps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      changed_components: ${{ steps.detect.outputs.changed_components }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      spec_changed: ${{ steps.detect.outputs.spec_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release tooling dependencies
        run: python -m pip install pyyaml

      - name: Validate release manifests
        run: python scripts/release/validate-manifests.py

      - id: base
        name: Resolve comparison base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          fi

      - id: detect
        name: Detect manifest version increments
        run: python scripts/release/changed-components.py --base-ref "${{ steps.base.outputs.ref }}" --github-output

  collector:
    name: Collector affected tests
    runs-on: ubuntu-latest
    needs: detect
    if: contains(needs.detect.outputs.changed_components, 'collector') || contains(needs.detect.outputs.changed_components, 'loxa') || needs.detect.outputs.spec_changed == 'true'
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod
      - run: go test ./...

  cortex:
    name: Cortex affected tests
    runs-on: ubuntu-latest
    needs: detect
    if: contains(needs.detect.outputs.changed_components, 'cortex') || contains(needs.detect.outputs.changed_components, 'loxa')
    defaults:
      run:
        working-directory: cortex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cortex/go.mod
      - run: go test ./...

  cli:
    name: CLI affected tests
    runs-on: ubuntu-latest
    needs: detect
    if: contains(needs.detect.outputs.changed_components, 'cli') || contains(needs.detect.outputs.changed_components, 'loxa') || needs.detect.outputs.spec_changed == 'true'
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - run: go test ./...

  spec-and-sdks:
    name: Spec and SDK conformance checks
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.spec_changed == 'true' || contains(needs.detect.outputs.changed_components, 'sdk-') || contains(needs.detect.outputs.changed_components, 'loxa')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Python dependencies
        run: |
          python -m pip install pytest pyyaml
          python -m pip install -e sdks/py
      - name: Spec validation
        run: python spec/conformance/verify.py || python spec/conformance/runner.py --sdk python --group all
      - name: Go SDK tests
        if: needs.detect.outputs.spec_changed == 'true' || contains(needs.detect.outputs.changed_components, 'sdk-go')
        run: go test ./...
        working-directory: sdks/go
      - name: JS SDK tests
        if: needs.detect.outputs.spec_changed == 'true' || contains(needs.detect.outputs.changed_components, 'sdk-js')
        run: |
          npm ci
          npm run build
          npm test
        working-directory: sdks/js
      - name: Python SDK tests
        if: needs.detect.outputs.spec_changed == 'true' || contains(needs.detect.outputs.changed_components, 'sdk-py')
        run: pytest -v
        working-directory: sdks/py
      - name: Rust SDK tests
        if: needs.detect.outputs.spec_changed == 'true' || contains(needs.detect.outputs.changed_components, 'sdk-rs')
        run: cargo test --all-features
        working-directory: sdks/rs

  lql:
    name: LQL affected tests
    runs-on: ubuntu-latest
    needs: detect
    if: contains(needs.detect.outputs.changed_components, 'lql') || contains(needs.detect.outputs.changed_components, 'loxa')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path lql/Cargo.toml
