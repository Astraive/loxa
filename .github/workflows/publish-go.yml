name: Publish Go SDK

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish Go SDK
    if: inputs.component == 'sdk-go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod
          check-latest: true
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install manifest tooling
        run: python -m pip install pyyaml

      - name: Validate manifest
        run: python scripts/release/validate-manifests.py --component sdk-go

      - name: Test Go SDK
        run: go test ./...
        working-directory: sdks/go

      - name: Check component tag is available
        run: python scripts/release/tag-component.py sdk-go --dry-run

      - name: Create component tag
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python scripts/release/tag-component.py sdk-go --dry-run)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${tag}" \
            -f "sha=${GITHUB_SHA}"

      - name: Verify published module resolution
        if: inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cd "$tmp"
          go mod init verify-loza-sdk
          for attempt in {1..12}; do
            if GOWORK=off GOPROXY=https://proxy.golang.org,direct \
              go get "github.com/astraive/loza/sdks/go@v${{ inputs.version }}" && \
              go list -m github.com/astraive/loza/sdks/go; then
              exit 0
            fi
            if [[ "$attempt" == "12" ]]; then
              exit 1
            fi
            sleep 10
          done
