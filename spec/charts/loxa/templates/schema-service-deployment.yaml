{{- if .Values.schemaService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loxa.fullname" . }}-schema-service
  labels:
    {{- include "loxa.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-service
spec:
  replicas: {{ .Values.schemaService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "loxa.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: schema-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "loxa.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: schema-service
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.schemaService.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: schema-service
          image: "{{ .Values.schemaService.image.repository }}:{{ .Values.schemaService.image.tag }}"
          imagePullPolicy: {{ .Values.schemaService.image.pullPolicy }}
          command:
            - sh
            - -c
            - >-
              python -u services/schema_service.py
              --host ${SCHEMA_SERVICE_HOST:-0.0.0.0}
              --port ${SCHEMA_SERVICE_PORT:-8080}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "loxa.fullname" . }}-schema-service
            {{- range .Values.schemaService.secretRefs }}
            - secretRef:
                name: {{ . | quote }}
                optional: true
            {{- end }}
          {{- with .Values.schemaService.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.schemaService.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.schemaService.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.schemaService.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.schemaService.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.schemaService.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.schemaService.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.schemaService.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.schemaService.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.schemaService.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.schemaService.livenessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.schemaService.resources | nindent 12 }}
{{- end }}
