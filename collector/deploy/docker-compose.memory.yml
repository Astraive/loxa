# Loxa Collector — memory eventbus (default, for local dev/testing)
# Usage: docker compose -f docker-compose.memory.yml up
services:
  collector:
    build:
      context: ../..
      dockerfile: collector/deploy/Dockerfile.collector
    command: ["./loxa-collector", "run", "-c", "/app/build/loxa-collector.yaml"]
    ports:
      - "9308:9308"
    volumes:
      - ../:/app
    environment:
      LOXA_EVENTBUS: memory
      COLLECTOR_RELIABILITY_MODE: direct

  sample-app:
    image: curlimages/curl:8.12.1
    depends_on:
      - collector
    volumes:
      - ../build:/payload
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 3
        curl -sS -X POST http://collector:9308/ingest \
          --data-binary @/payload/sample-events.ndjson \
          -H "Content-Type: application/x-ndjson"
