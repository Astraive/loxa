# WARNING: This file is for LOCAL DEVELOPMENT ONLY.
# Production deployments MUST:
#   1. Set POSTGRES_PASSWORD to a strong secret (not "changeme")
#   2. Enable TLS on all services (set CORTEX_TLS_ENABLED=true)
#   3. Use a secrets manager (Vault, AWS Secrets Manager, etc.)
#   4. Remove port bindings to host network
#   5. Enable authentication (set CORTEX_AUTH_ENABLED=true)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cortex
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD environment variable}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/sql:/docker-entrypoint-initdb.d
    # ports:
    #   - "5432:5432"  # SECURITY: Do not expose database port in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex"]
      interval: 10s
      timeout: 5s
      retries: 5

  cortex:
    build:
      context: ../..
      dockerfile: cortex/configs/Dockerfile
    ports:
      - "9312:9312"
      - "9313:9313"
    environment:
      CORTEX_STORAGE_BACKEND: postgres
      CORTEX_POSTGRES_HOST: postgres
      CORTEX_POSTGRES_PORT: 5432
      CORTEX_POSTGRES_DATABASE: cortex
      CORTEX_POSTGRES_USER: cortex
      CORTEX_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD environment variable}
      # The local Compose PostgreSQL service does not provision TLS. Production
      # deployments inherit the secure "require" default from the bundled config.
      CORTEX_POSTGRES_SSL_MODE: disable
      CORTEX_AUTH_ENABLED: "true"
      CORTEX_API_KEYS: ${CORTEX_API_KEYS:?Set CORTEX_API_KEYS as name:key:role}
      CORTEX_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app/configs:ro

  cortex-cli:
    profiles: ["cli"]
    image: astraive/loza-cli:0.3.2
    environment:
      LOZA_CORTEX_URL: http://cortex:9312
    depends_on:
      - cortex

volumes:
  postgres_data:
