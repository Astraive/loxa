name: DuckDB Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bench:
    name: DuckDB benchmark matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable

      - name: Run DuckDB benchmarks (Go)
        working-directory: ./loxa-collector
        run: |
          go test ./internal/sinks/duckdb -run "^$" -bench . -benchmem > duckdb_bench.txt

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-bench
          path: loxa-collector/duckdb_bench.txt
