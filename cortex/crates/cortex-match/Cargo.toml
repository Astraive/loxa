[package]
name = "cortex-match"
version = "0.2.3"
edition = "2021"
description = "High-performance incident shape matching for LOXA Cortex"
authors = ["LOXA Team"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[lib]
name = "cortex_match"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "cortex_match_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
