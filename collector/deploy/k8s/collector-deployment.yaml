apiVersion: apps/v1
kind: Deployment
metadata:
  name: loxa-collector
  labels:
    app.kubernetes.io/name: loxa-collector
    app.kubernetes.io/component: collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: loxa-collector
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loxa-collector
        app.kubernetes.io/component: collector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: collector
          image: ghcr.io/astraive/loxa:0.2.6
          securityContext:
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          args:
            - run
            - -c
            - /etc/loxa/config.yaml
          ports:
            - name: http
              containerPort: 9308
              protocol: TCP
          env:
            - name: COLLECTOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: loxa-collector-secrets
                  key: api-key
            - name: LOXA_STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: loxa-collector-secrets
                  key: storage-encryption-key
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/loxa
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: loxa-collector-config
        - name: data
          emptyDir: {}
