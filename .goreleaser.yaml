project_name: loxa

version: 2

builds:
  - id: loxa-cli
    dir: ./cli
    main: ./cmd/loxa
    binary: loxa
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/astraive/loxa/cli/internal/version.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: loxa-cli
    ids: [loxa-cli]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "loxa_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: Astraive
    name: loxa
  name_template: "LOXA CLI {{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
