name: Spec CI

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - ".github/workflows/spec-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "spec/**"

permissions:
  contents: read

jobs:
  generation-check:
    name: Verify generated artifacts are up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check generated artifacts
        working-directory: spec
        run: python codegen/generate.py --check

  mirror-check:
    name: Verify mirror folders are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check mirror consistency
        working-directory: spec
        run: python scripts/check_mirrors.py

  conformance-check:
    name: Verify grouped SDK conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - name: Install conformance dependencies
        run: python -m pip install --upgrade pip jsonschema pytest
      - name: Check fixture conformance
        working-directory: spec
        run: python scripts/check_conformance.py
      - name: Run grouped SDK conformance
        working-directory: spec
        run: python conformance/runner.py --sdk all --group all

  release-protection:
    name: Protect release folder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify release folder structure
        working-directory: spec
        run: python scripts/check_releases.py
      - name: Check release folder changes (PR only)
        if: github.event_name == 'pull_request'
        working-directory: spec
        run: |
          echo "Checking for changes in releases/..."
          if git diff origin/main...HEAD -- releases/ | grep -q .; then
            echo "Changes detected in releases/"
            echo "Release snapshots are immutable. To modify:"
            echo "1. Update CHANGELOG.md with version notes"
            echo "2. Explain changes in commit message"
            echo "3. Request approval from maintainers"
            exit 1
          fi
          echo "releases/ unchanged"
