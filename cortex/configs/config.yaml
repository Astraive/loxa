server:
  host: "0.0.0.0"
  port: 9312

grpc:
  enabled: true
  host: "0.0.0.0"
  port: 9313

storage:
  backend: "postgres"
  postgresql:
    host: "localhost"
    port: 5432
    database: "cortex"
    user: "cortex"
    password: ""
    # SECURITY: Disable in production; set to "require" or "verify-full"
    ssl_mode: "disable"
    max_connections: 50

authentication:
  # SECURITY: Disabled for local dev only. Production MUST enable.
  enabled: false
  api_keys: []

rate_limit:
  enabled: false

tls:
  enabled: false
  min_version: "1.3"

pii_redaction:
  enabled: false

logging:
  level: "info"
  format: "json"

collector:
  mode: "fanout"
  url: "http://localhost:9308"
  poll_interval: 30s