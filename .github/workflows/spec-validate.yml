name: Spec Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JavaScript SDK dependencies
        run: bun install --frozen-lockfile
        working-directory: sdks/js

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest
          pip install -e sdks/py

      - name: Check generated spec artifacts
        run: |
          python spec/codegen/generate.py --check
          python spec/scripts/check_mirrors.py
          python spec/scripts/check_conformance.py

      - name: Run conformance runner
        run: |
          python spec/conformance/runner.py --sdk all
