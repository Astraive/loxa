apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex
  labels:
    app: cortex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex
  template:
    metadata:
      labels:
        app: cortex
    spec:
      containers:
      - name: cortex
        image: astraive/loxa-cortex:0.2.5
        ports:
        - containerPort: 9312
          name: http
        - containerPort: 9313
          name: grpc
        env:
        - name: CORTEX_STORAGE_BACKEND
          value: "postgres"
        - name: CORTEX_POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: cortex-config
              key: postgres_host
        - name: CORTEX_POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: cortex-config
              key: postgres_port
        - name: CORTEX_LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9312
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9312
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cortex
spec:
  selector:
    app: cortex
  ports:
  - name: http
    port: 9312
    targetPort: 9312
  - name: grpc
    port: 9313
    targetPort: 9313
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cortex-config
data:
  postgres_host: "postgres.default.svc.cluster.local"
  postgres_port: "5432"