name: Protobuf generation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "proto/loza/core/*.proto"
  pull_request:
    paths:
      - "proto/loza/core/*.proto"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install protoc
        run: |
          PROTOC_VERSION=34.1
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -o /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          rm /tmp/protoc.zip

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Generate and verify Go protobuf code
        run: make check-proto

      - name: Upload generated protos
        uses: actions/upload-artifact@v4
        with:
          name: protos-generated
          path: gen/go/loza/core/
