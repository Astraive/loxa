server:
  host: "0.0.0.0"
  port: 9312

grpc:
  enabled: true
  host: "0.0.0.0"
  port: 9313

storage:
  backend: "postgres"
  postgresql:
    host: "localhost"
    port: 5432
    database: "cortex"
    user: "cortex"
    password: ""
    # SECURITY: TLS required for all connections. Set to "verify-full" when CA is available.
    ssl_mode: "require"
    max_connections: 50

authentication:
  # API keys are supplied at runtime via CORTEX_API_KEYS.
  enabled: true
  api_keys: []

rate_limit:
  enabled: true
  per_api_key_rpm: 1000
  per_ip_rpm: 100

tls:
  enabled: false
  min_version: "1.3"

pii_redaction:
  enabled: false

logging:
  level: "info"
  format: "json"

collector:
  mode: "fanout"
  url: "http://localhost:9308"
  poll_interval: 30s