apiVersion: apps/v1
kind: Deployment
metadata:
  name: loxa-collector
  labels:
    app.kubernetes.io/name: loxa-collector
    app.kubernetes.io/component: collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: loxa-collector
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loxa-collector
        app.kubernetes.io/component: collector
    spec:
      containers:
        - name: collector
          image: ghcr.io/astraive/loxa-collector:latest
          args:
            - run
            - -c
            - /etc/loxa/config.yaml
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/loxa
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: loxa-collector-config
        - name: data
          emptyDir: {}
