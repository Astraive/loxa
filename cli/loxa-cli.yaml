name: loxa-cli
kind: cli
version: 0.2.5
description: Local operator and developer CLI for LOXA
license: MIT
repository: https://github.com/Astraive/loxa
module: github.com/astraive/loxa/cli

paths:
  root: cli
  main: cli/cmd/loxa

publish:
  github_release:
    owner: astraive
    binary: loxa
    tag_prefix: cli/v
  go:
    owner: astraive
    install: github.com/astraive/loxa/cli/cmd/loxa
