openapi: 3.1.0
info:
  title: LOZA Collector API
  version: v1
  description: |
    HTTP ingest contract for LOZA-compatible collectors.

    Authentication is typically enforced via an API key header. HTTP is the
    canonical wire contract; gRPC and GraphQL surfaces are expected to expose
    the same readiness and ingest semantics when enabled.

    This spec covers the public ingest surface. Admin/operational APIs
    (query, DLQ, keys, schema, sinks, tail, replay) are documented
    separately in the collector admin API spec.
paths:
  /events:
    post:
      summary: Ingest LOZA events (canonical path)
      description: |
        Canonical ingest endpoint used by SDKs. Accepts the same payloads
        as /ingest — single event, array, envelope, NDJSON, or gzip.
      parameters:
        - name: X-LOZA-API-Key
          in: header
          required: false
          description: API key header when auth is enabled.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ../schemas/json/event.schema.json
                - type: array
                  items:
                    $ref: ../schemas/json/event.schema.json
                - $ref: ../schemas/json/ingest-envelope.schema.json
          application/x-ndjson:
            schema:
              type: string
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/json/collector-response.schema.json
        "207":
          description: partial success
          content:
            application/json:
              schema:
                $ref: ../schemas/json/collector-response.schema.json
        "400":
          description: bad request
        "401":
          description: unauthorized
        "413":
          description: payload too large
    delete:
      summary: Delete events
      description: Delete events by tenant, user, or event ID.
      parameters:
        - name: X-LOZA-API-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
        "401":
          description: auth error
  /ingest:
    post:
      summary: Ingest LOZA events
      description: |
        Accepts a single JSON object, a JSON array, a wrapped `{ "events": [...] }`
        payload, NDJSON, and gzip-compressed equivalents.

        Successful responses return a collector response object with
        `accepted`, `rejected`, `invalid`, `deduped`, and per-event `acks`.
      parameters:
        - name: X-LOZA-API-Key
          in: header
          required: false
          description: Example API key header when auth is enabled.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ../schemas/json/event.schema.json
                - type: array
                  items:
                    $ref: ../schemas/json/event.schema.json
                - $ref: ../schemas/json/ingest-envelope.schema.json
          application/x-ndjson:
            schema:
              type: string
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/json/collector-response.schema.json
        "207":
          description: partial success
          content:
            application/json:
              schema:
                $ref: ../schemas/json/collector-response.schema.json
        "400":
          description: invalid payload
          content:
            application/json:
              schema:
                $ref: ../schemas/json/collector-response.schema.json
        "401":
          description: auth error
          content:
            application/json:
              schema:
                $ref: ../schemas/json/collector-response.schema.json
        "429":
          description: rate limited
          content:
            application/json:
              schema:
                $ref: ../schemas/json/collector-response.schema.json
        "503":
          description: unavailable
          content:
            application/json:
              schema:
                $ref: ../schemas/json/collector-response.schema.json
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /readyz:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "503":
          description: not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /metrics:
    get:
      summary: Metrics endpoint
      responses:
        "200":
          description: Prometheus metrics
  /health:
    get:
      summary: Liveness probe (alias for /healthz)
      responses:
        "200":
          description: healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /ready:
    get:
      summary: Readiness probe (alias for /readyz)
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "503":
          description: not ready
  /version:
    get:
      summary: Collector version info
      responses:
        "200":
          description: version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  ingest_api_version:
                    type: string
                  schema_version:
                    type: string
                  event_version:
                    type: string
  /status:
    get:
      summary: Collector status
      description: Returns current collector runtime status including sink health and queue depths.
      responses:
        "200":
          description: status
          content:
            application/json:
              schema:
                type: object
  /query:
    post:
      summary: Query stored events
      description: Execute a SQL query against stored events.
      parameters:
        - name: X-LOZA-API-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sql:
                  type: string
                  description: SQL query to execute
      responses:
        "200":
          description: query results
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
        "400":
          description: invalid query
        "401":
          description: auth error
  /lql/query:
    post:
      summary: Execute LQL query
      description: Execute a Loza Query Language (LQL) query against stored events.
      parameters:
        - name: X-LOZA-API-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: LQL query string
      responses:
        "200":
          description: query results
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
        "400":
          description: invalid query
        "401":
          description: auth error
  /tail:
    get:
      summary: Tail events (streaming)
      description: |
        Returns recent events matching optional query parameters. Used for
        real-time event streaming and debugging.
      parameters:
        - name: event
          in: query
          schema:
            type: string
          description: Filter by event name
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
          description: Maximum number of events to return
      responses:
        "200":
          description: matching events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
        "401":
          description: auth error
  /sinks:
    get:
      summary: List configured sinks
      parameters:
        - name: X-LOZA-API-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: sink list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sinks:
                    type: array
                    items:
                      type: object
  /schema:
    get:
      summary: List schema versions
      parameters:
        - name: X-LOZA-API-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: schema list
          content:
            application/json:
              schema:
                type: object
  /dlq:
    get:
      summary: List dead-letter queue entries
      parameters:
        - name: X-LOZA-API-Key
          in: header
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Maximum entries to return
      responses:
        "200":
          description: DLQ entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
  /keys:
    post:
      summary: Create API key
      parameters:
        - name: X-LOZA-API-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                kind:
                  type: string
                  enum: [sec, live]
      responses:
        "201":
          description: key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  key:
                    type: string
        "401":
          description: auth error
