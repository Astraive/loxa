name: Publish Python

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
    secrets:
      PYPI_API_TOKEN:
        required: true

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  publish:
    if: inputs.component == 'sdk-py'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/py
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install pyyaml
        working-directory: .

      - run: python scripts/release/validate-manifests.py --component sdk-py
        working-directory: .

      - name: Install build tooling
        run: python -m pip install build twine pytest

      - name: Install package
        run: python -m pip install -e .

      - name: Run tests
        run: pytest -v

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distribution
        run: twine check dist/*

      - name: Check component tag is available
        run: python scripts/release/tag-component.py sdk-py --dry-run
        working-directory: .

      - name: Publish package
        if: inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/py/dist
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create component tag
        if: inputs.dry_run != true
        run: python scripts/release/tag-component.py sdk-py --push
        working-directory: .
