name: Spec Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Check generated spec artifacts
        run: |
          python loxa-spec/codegen/generate.py --check
          python loxa-spec/scripts/check_mirrors.py
          python loxa-spec/scripts/check_conformance.py

      - name: Run conformance runner
        run: |
          python loxa-spec/conformance_runner.py --sdk=python
