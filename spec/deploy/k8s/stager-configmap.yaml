apiVersion: v1
kind: ConfigMap
metadata:
  name: loza-stager-config
  labels:
    app.kubernetes.io/name: stager
    app.kubernetes.io/part-of: loza
data:
  STAGER_QUEUE_BACKEND: kafka
  STAGER_QUEUE_DIR: /var/loza/ingest-queue
  STAGER_STAGING_DIR: /var/loza/staging
  STAGER_BATCH_SIZE: "100"
  STAGER_LOOP: "true"
  STAGER_COMPRESS: "true"
  STAGER_POLL_INTERVAL_SECONDS: "2"
  STAGER_HEARTBEAT_FILE: /app/health/stager.heartbeat
  STAGER_HEARTBEAT_MAX_AGE_SECONDS: "120"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: loza-events
  KAFKA_GROUP_ID: loza-stager
  KAFKA_DLQ_TOPIC: loza-events.dlq
  KAFKA_AUTO_OFFSET_RESET: earliest
  KAFKA_POLL_TIMEOUT_SECONDS: "1"
  KAFKA_FLUSH_TIMEOUT_SECONDS: "10"
