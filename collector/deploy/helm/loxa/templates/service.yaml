{{- if .Values.collector.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "loxa.fullname" . }}-collector
  labels:
    {{- include "loxa.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
  {{- with .Values.collector.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.collector.service.type }}
  ports:
    - port: {{ .Values.collector.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.collector.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "loxa.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: collector
{{- end }}
