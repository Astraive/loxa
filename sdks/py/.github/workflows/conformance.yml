name: conformance
on: [push, pull_request]
jobs:
  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loxa-py
    steps:
      - uses: actions/checkout@v4
        with:
          path: loxa-py
      - uses: actions/checkout@v4
        with:
          repository: Astraive/loxa-spec
          path: loxa-spec
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e . pytest
      - working-directory: loxa-spec
        run: python conformance/runner.py --sdk python --group all
