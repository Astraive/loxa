[package]
name = "loxa"
version = "1.0.0"
edition = "2021"
description = "Rust LOXA wide-event SDK"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting", "parsing"] }
fastrand = "2"
flate2 = "1"
ureq = { version = "2", features = ["gzip", "json"] }
regex = "1"
sha2 = "0.10"
hostname = "0.4"
