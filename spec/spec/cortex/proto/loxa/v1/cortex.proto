syntax = "proto3";

package loxa.v1;

option go_package = "github.com/astraive/loxa-spec/proto/loxa/v1;loxav1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service CortexService {
  rpc Healthz(HealthzRequest) returns (HealthzResponse);
  rpc IngestEvent(IngestEventRequest) returns (IngestEventResponse);
  rpc IngestBatch(IngestBatchRequest) returns (IngestBatchResponse);
  rpc Reconstruct(ReconstructRequest) returns (ReconstructResponse);
  rpc GetGraph(GetGraphRequest) returns (GetGraphResponse);
  rpc RecordFeedback(RecordFeedbackRequest) returns (RecordFeedbackResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream CortexEvent);
}

message HealthzRequest {}
message HealthzResponse {
  string status = 1;
}

message CortexEvent {
  string event_id = 1;
  string schema_version = 2;
  string event_version = 3;
  google.protobuf.Timestamp timestamp = 4;
  string service = 5;
  string event = 6;
  string kind = 7;
  string level = 8;
  string outcome = 9;
  string trace_id = 10;
  string span_id = 11;
  string parent_span_id = 12;
  string request_id = 13;
  string incident_id = 14;
  string provenance = 15;
  google.protobuf.Struct raw = 100;
}

message IngestEventRequest {
  CortexEvent event = 1;
}

message IngestEventResponse {
  string status = 1;
  string event_id = 2;
  string incident_id = 3;
}

message IngestBatchRequest {
  repeated CortexEvent events = 1;
}

message IngestBatchResponse {
  string status = 1;
  int32 accepted = 2;
  int32 rejected = 3;
  int32 invalid = 4;
  repeated CortexIngestError errors = 5;
}

message CortexIngestError {
  string event_id = 1;
  string code = 2;
  string message = 3;
  bool retryable = 4;
}

message ReconstructRequest {
  string incident_id = 1;
  string mode = 2;
}

message GraphNode {
  string id = 1;
  string type = 2;
  string label = 3;
  string service = 4;
  google.protobuf.Struct attributes = 5;
}

message GraphEdge {
  string id = 1;
  string from_node_id = 2;
  string to_node_id = 3;
  string type = 4;
  double weight = 5;
  google.protobuf.Struct attributes = 6;
}

message Evidence {
  string event_id = 1;
  string reason = 2;
  double confidence = 3;
}

message ReconstructResponse {
  string incident_id = 1;
  string status = 2;
  string severity = 3;
  string primary_service = 4;
  repeated string affected_services = 5;
  repeated GraphNode nodes = 6;
  repeated GraphEdge edges = 7;
  repeated Evidence evidence = 8;
  string summary = 9;
  double confidence = 10;
}

message GetGraphRequest {
  string service = 1;
  string incident_id = 2;
  int32 depth = 3;
}

message GetGraphResponse {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
}

message RecordFeedbackRequest {
  string incident_id = 1;
  string remediation_id = 2;
  bool success = 3;
  string notes = 4;
}

message RecordFeedbackResponse {
  string status = 1;
}

message StreamEventsRequest {
  string incident_id = 1;
}
