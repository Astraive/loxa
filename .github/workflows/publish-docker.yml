name: Publish Docker

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read
  security-events: write

jobs:
  publish:
    if: inputs.component == 'collector' || inputs.component == 'cortex'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install pyyaml

      - name: Validate manifest
        run: python scripts/release/validate-manifests.py --component "${{ inputs.component }}"

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.component }}/go.mod

      - name: Install protoc
        if: inputs.component == 'collector' || inputs.component == 'cortex'
        run: |
          PROTOC_VERSION=34.1
          PROTOC_SHA256=af27ea66cd26938fe48587804ca7d4817457a08350021a1c6e23a27ccc8c6904
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -o /tmp/protoc.zip
          echo "${PROTOC_SHA256}  /tmp/protoc.zip" | sha256sum -c -
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          rm /tmp/protoc.zip

      - name: Install Go protoc plugins
        if: inputs.component == 'collector' || inputs.component == 'cortex'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Generate protobuf code
        if: inputs.component == 'collector' || inputs.component == 'cortex'
        run: make proto

      - name: Run component tests
        run: go test ./...
        working-directory: ${{ inputs.component }}

      - name: Check component tag is available
        run: python scripts/release/tag-component.py "${{ inputs.component }}" --dry-run

      - id: manifest
        name: Read Docker publish metadata
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, yaml
          component = "${{ inputs.component }}"
          registry = yaml.safe_load(open("release.yaml", encoding="utf-8"))["components"]
          manifest = yaml.safe_load(open(registry[component], encoding="utf-8"))
          docker = manifest["publish"]["docker"]
          paths = manifest.get("paths", {})
          version = "${{ inputs.version }}"
          images = docker["images"]
          tags = []
          for image in images:
              tags.append(f"{image}:{version}")
              if "${{ github.ref }}" == "refs/heads/main" and "${{ inputs.dry_run }}" != "true":
                  tags.append(f"{image}:latest")
          print("dockerfile=" + (paths.get("dockerfile") or docker.get("dockerfile")))
          print("context=" + docker.get("context", "."))
          print("primary_tag=" + tags[0])
          print("tags=" + ",".join(tags))
          PY

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: inputs.dry_run != true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: inputs.dry_run != true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.manifest.outputs.context }}
          file: ${{ steps.manifest.outputs.dockerfile }}
          push: ${{ inputs.dry_run != true }}
          tags: ${{ steps.manifest.outputs.tags }}
          provenance: true
          sbom: true

      - name: Scan image for vulnerabilities
        if: inputs.dry_run != true
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps.manifest.outputs.primary_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload vulnerability scan
        if: inputs.dry_run != true && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Install cosign
        if: inputs.dry_run != true
        uses: sigstore/cosign-installer@v3.8.2

      - name: Sign published image digest
        if: inputs.dry_run != true
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.manifest.outputs.tags }}
        run: |
          set -euo pipefail
          IFS=',' read -ra image_tags <<< "$TAGS"
          for tag in "${image_tags[@]}"; do
            image="${tag%%:*}"
            cosign sign --yes "${image}@${DIGEST}"
          done

      - name: Create component tag
        if: inputs.dry_run != true
        run: python scripts/release/tag-component.py "${{ inputs.component }}" --push
