name: LQL CI

on:
  push:
    paths: ["lql/**", ".github/workflows/lql-ci.yml"]
  pull_request:
    paths: ["lql/**"]

permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lql

      - name: Build
        run: cargo build --manifest-path lql/Cargo.toml --all-targets

      - name: Test
        run: cargo test --manifest-path lql/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path lql/Cargo.toml -- -D warnings

      - name: Format
        run: cargo fmt --manifest-path lql/Cargo.toml -- --check

  wasm:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lql

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Build WASM
        run: wasm-pack build lql --target web --release
        env:
          WASM_PACK_PROFILE: release
