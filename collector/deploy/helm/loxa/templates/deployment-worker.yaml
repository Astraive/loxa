{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loxa.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loxa.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "loxa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        {{- toYaml .Values.worker.podAnnotations | nindent 8 }}
      labels:
        {{- include "loxa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- toYaml .Values.worker.podLabels | nindent 8 }}
    spec:
      serviceAccountName: {{ include "loxa.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "loxa.worker.image" . }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["loxa-worker"]
          args: ["run", "-c", "/app/config/config.yaml"]
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if .Values.collector.enabled }}
          env:
            - name: LOXA_STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "collector.security.existingSecret is required when collector.enabled is true" .Values.collector.security.existingSecret }}
                  key: {{ .Values.collector.security.storageEncryptionKey }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ include "loxa.fullname" . }}-worker-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-worker" (include "loxa.fullname" .)) .Values.persistence.worker.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}