name: Rust SDK CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test --lib --test behavior --test api_behavior_test --test config_env --test dsn_test --test parity --test typed_attribute_helpers --test domain_helpers_test --test smoke --test e2e
