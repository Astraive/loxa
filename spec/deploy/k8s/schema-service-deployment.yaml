apiVersion: apps/v1
kind: Deployment
metadata:
  name: loza-schema-service
  labels:
    app.kubernetes.io/name: schema-service
    app.kubernetes.io/part-of: loza
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-service
      app.kubernetes.io/part-of: loza
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-service
        app.kubernetes.io/part-of: loza
    spec:
      containers:
        - name: schema-service
          image: ghcr.io/astraive/loza-schema-service:0.2.6
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              python -u services/schema_service.py
              --host ${SCHEMA_SERVICE_HOST:-0.0.0.0}
              --port ${SCHEMA_SERVICE_PORT:-9315}
          ports:
            - name: http
              containerPort: 9315
          envFrom:
            - configMapRef:
                name: loza-schema-service-config
            - secretRef:
                name: loza-schema-service-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
