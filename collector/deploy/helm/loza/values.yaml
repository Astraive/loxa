global:
  imageRegistry: ghcr.io/astraive
  imagePullSecrets: []
  serviceAccount:
    create: true
    name: ""
    annotations: {}

nameOverride: ""
fullnameOverride: ""

collector:
  enabled: true
  replicaCount: 2

  image:
    repository: loza
    tag: "0.4.1"
    digest: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9308
    metricsPort: 9308
    annotations: {}

  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

  podAnnotations: {}
  podLabels: {}

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: loza.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  nodeSelector: {}
  tolerations: []
  affinity: {}

  security:
    # Existing Secret containing the Collector authentication and encryption material.
    # Required whenever collector.enabled is true.
    existingSecret: ""
    authServerSecretKey: auth-server-secret
    ingestKeySecretKey: ingest-key-secret
    adminKeySecretKey: admin-key-secret
    storageEncryptionKey: storage-encryption-key

  config:
    collector:
      addr: ":9308"
      read_header_timeout: "5s"
      shutdown_timeout: "10s"
      max_body_bytes: 10485760
      max_events_per_request: 5000

    auth:
      enabled: true
      header: X-API-Key
      server_secret: ${COLLECTOR_AUTH_SERVER_SECRET}
      cache_ttl: 5m
      negative_cache_ttl: 30s
      keys:
        - name: collector-ingest
          key_id: kingest
          secret_env: COLLECTOR_INGEST_KEY_SECRET
          kind: sec
          roles:
            - collector_ingest_server
        - name: collector-admin
          key_id: kadmin
          secret_env: COLLECTOR_ADMIN_KEY_SECRET
          kind: sec
          roles:
            - project_admin

    rate_limit:
      enabled: true
      rps: 1000
      burst: 1000

    routes:
      ingest: /events
      health: /health
      ready: /readyz
      metrics: /metrics

    storage:
      primary: duckdb
      encryption_key_env: LOZA_STORAGE_ENCRYPTION_KEY

    duckdb:
      path: /data/loza.db
      store_raw: true
      checkpoint_on_shutdown: true

    lql:
      enabled: true
      binary: /usr/local/bin/lql
      expected_protocol_version: 1
      expected_compiler_version: 0.5.0
      expected_language_version: 0.1
      startup_timeout: 5s
      compile_timeout: 5s
      # The stdio compiler protocol is sequential.
      max_concurrent_requests: 1
    logging:
      level: info
      format: json

    metrics:
      prometheus: true

worker:
  enabled: false
  replicaCount: 2

  image:
    repository: loza-worker
    tag: "0.4.1"
    digest: ""
    pullPolicy: IfNotPresent

  podAnnotations: {}
  podLabels: {}

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}

  config:
    kafka:
      brokers: []
      topic: ""

    storage:
      primary: duckdb
      encryption_key_env: LOZA_STORAGE_ENCRYPTION_KEY

    duckdb:
      path: /data/loza.db
      store_raw: true
      checkpoint_on_shutdown: true

    worker:
      consumer_group: "loza-worker"
      poll_timeout: "1s"

    logging:
      level: info
      format: json

    metrics:
      prometheus: true

    fanout:
      outputs: []

    reliability:
      mode: memory

persistence:
  enabled: false

  collector:
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi

  worker:
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi

networkPolicy:
  enabled: true
  # Production charts default to deny-all ingress. Add explicit rules for app
  # namespaces/pods that may send events to the collector.
  egress: {}
  ingress: []

rbac:
  create: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  capabilities:
    drop:
      - ALL
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
