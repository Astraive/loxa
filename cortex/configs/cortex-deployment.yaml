apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex
  labels:
    app.kubernetes.io/name: cortex
    app.kubernetes.io/component: cortex
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cortex
      app.kubernetes.io/component: cortex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cortex
        app.kubernetes.io/component: cortex
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: cortex
          image: ghcr.io/astraive/loxa-cortex:0.2.5
          securityContext:
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 9312
              protocol: TCP
            - name: grpc
              containerPort: 9313
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cortex-config
          env:
            - name: CORTEX_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: postgres-password
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
