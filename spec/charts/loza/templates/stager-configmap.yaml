{{- if .Values.stager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loza.fullname" . }}-stager
  labels:
    {{- include "loza.labels" . | nindent 4 }}
    app.kubernetes.io/component: stager
data:
  {{- range $key, $value := .Values.stager.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
