name: Publish CLI

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

jobs:
  validate:
    if: inputs.component == 'cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyyaml
      - run: python scripts/release/validate-manifests.py --component cli
      - name: Verify pinned spec module tag
        if: inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          spec_version="$(
            python - <<'PY'
          import re
          from pathlib import Path

          match = re.search(
              r"^\s*github\.com/astraive/loza/spec\s+v([^\s]+)",
              Path("cli/go.mod").read_text(encoding="utf-8"),
              re.MULTILINE,
          )
          if match is None:
              raise SystemExit("cli/go.mod does not pin github.com/astraive/loza/spec")
          print(match.group(1))
          PY
          )"
          git ls-remote --exit-code origin "refs/tags/spec/v${spec_version}" >/dev/null
      - name: Use local spec module for dry run
        if: inputs.dry_run == true
        run: go mod edit -replace=github.com/astraive/loza/spec=../spec
        working-directory: cli
      - name: Run CLI tests
        env:
          GOWORK: off
        run: go test ./...
        working-directory: cli
      - name: Check component tag is available
        run: python scripts/release/tag-component.py cli --dry-run

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            goos: linux
            goarch: amd64
            extension: ""
          - os: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            extension: ""
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            extension: ""
          - os: macos-14
            goos: darwin
            goarch: arm64
            extension: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            extension: .exe
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Use local spec module for dry run
        if: inputs.dry_run == true
        run: go mod edit "-replace=github.com/astraive/loza/spec=../spec"
        working-directory: cli
      - name: Build native CLI
        shell: bash
        working-directory: cli
        env:
          OUTPUT: ../dist/loza${{ matrix.extension }}
        run: |
          mkdir -p ../dist
          CGO_ENABLED=1 go build -trimpath \
            -ldflags "-s -w -X github.com/astraive/loza/cli/internal/version.Version=${{ inputs.version }}" \
            -o "$OUTPUT" ./cmd/loza
      - name: Smoke test native CLI
        shell: bash
        working-directory: cli
        run: ../dist/loza${{ matrix.extension }} > ../dist/smoke.txt
      - name: Package native CLI
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          import io
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          dist = Path("dist")
          binary = dist / f"loza{os.environ['EXTENSION']}"
          stem = f"loza_{os.environ['VERSION']}_{os.environ['GOOS']}_{os.environ['GOARCH']}"
          payload = binary.read_bytes()
          if os.environ["GOOS"] == "windows":
              archive = dist / f"{stem}.zip"
              info = zipfile.ZipInfo(binary.name, date_time=(1980, 1, 1, 0, 0, 0))
              info.create_system = 3
              info.external_attr = 0o100755 << 16
              info.compress_type = zipfile.ZIP_DEFLATED
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as bundle:
                  bundle.writestr(info, payload)
          else:
              archive = dist / f"{stem}.tar.gz"
              info = tarfile.TarInfo("loza")
              info.size = len(payload)
              info.mode = 0o755
              info.mtime = 0
              info.uid = 0
              info.gid = 0
              info.uname = ""
              info.gname = ""
              with archive.open("wb") as raw:
                  with gzip.GzipFile(fileobj=raw, mode="wb", filename="", mtime=0) as compressed:
                      with tarfile.open(fileobj=compressed, mode="w", format=tarfile.USTAR_FORMAT) as bundle:
                          bundle.addfile(info, io.BytesIO(payload))
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_suffix(archive.suffix + ".sha256").write_text(
              f"{digest}  {archive.name}\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/loza_*
      - uses: actions/upload-artifact@v4
        with:
          name: loza-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/loza_*.tar.gz
            dist/loza_*.tar.gz.sha256
            dist/loza_*.zip
            dist/loza_*.zip.sha256
          if-no-files-found: error

  publish:
    if: inputs.dry_run != true
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyyaml
      - uses: actions/download-artifact@v4
        with:
          pattern: loza-*
          merge-multiple: true
          path: artifacts
      - name: Publish CLI release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
          overwrite_files: true
      - name: Create component tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python scripts/release/tag-component.py cli --dry-run)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}"
      - name: Verify go install target
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if GOWORK=off GOPROXY=https://proxy.golang.org,direct \
              go install github.com/astraive/loza/cli/cmd/loza@v${{ inputs.version }}; then
              exit 0
            fi
            if [[ "$attempt" == "12" ]]; then
              exit 1
            fi
            sleep 10
          done
