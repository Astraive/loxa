collector:
  addr: ":9308"
  read_header_timeout: 5s
  shutdown_timeout: 10s
  max_body_bytes: 10485760
  max_events_per_request: 5000
  server:
    http:
      enabled: true
      addr: ":9308"
      read_header_timeout: 5s
      max_body_bytes: 10485760
      max_header_bytes: 1048576
      idle_timeout: 90s
    grpc:
      enabled: false
      port: ":9309"
      max_connections: 1000
      max_concurrent_streams: 100
      max_recv_msg_size: 4194304
      max_send_msg_size: 4194304
      keepalive:
        max_connection_age: 5m
        max_connection_age_grace: 30s
        time: 2m
        timeout: 20s
    graphql:
      enabled: false
      port: ":9310"
      playground: true
      depth_limit: 10
      batch_limit: 10

auth:
  enabled: true
  header: X-API-Key
  server_secret: ${COLLECTOR_AUTH_SERVER_SECRET}
  cache_ttl: 5m
  negative_cache_ttl: 30s
  keys:
    - name: collector-ingest
      key_id: kingest
      secret_env: COLLECTOR_INGEST_KEY_SECRET
      kind: sec
      mode: private
      roles:
        - collector_ingest_server
    - name: collector-admin
      key_id: kadmin
      secret_env: COLLECTOR_ADMIN_KEY_SECRET
      kind: sec
      mode: private
      roles:
        - project_admin

rate_limit:
  enabled: true
  rps: 1000
  burst: 1000

routes:
  ingest: /events
  health: /health
  ready: /readyz
  metrics: /metrics

storage:
  primary: duckdb
  encryption_key_env: LOZA_STORAGE_ENCRYPTION_KEY

duckdb:
  path: loza.db
  driver: duckdb
  table: events
  raw_column: raw
  store_raw: true
  checkpoint_on_shutdown: true
  checkpoint_interval: 0s
  max_open_conns: 1
  max_idle_conns: 1
  batch_size: 0
  flush_interval: 0s
  writer_loop: false
  writer_queue_size: 0
  use_appender: false
  write_timeout: 10s
  retry_attempts: 0
  retry_backoff: 50ms
  export:
    enabled: false
    format: parquet
    interval: 1h
    path: exports
  schema:
    event_id: event_id
    timestamp: timestamp
    event_name: event
    level: level
    status_code: status_code
    outcome: outcome
    service: service
    trace_id: trace_id
    span_id: span_id
    request_id: request_id
    duration_ms: duration_ms
    http_method: method
    http_path: path
    http_status: http.status_code
    incident_id: incident_id
    region: deployment.region
    host: http.host
  column_types:
    status_code: INTEGER
    http.status_code: INTEGER
    duration_ms: DOUBLE
    timestamp: TIMESTAMP
lql:
  enabled: true
  binary: /usr/local/bin/lql
  expected_protocol_version: 1
  expected_compiler_version: 0.4.0
  expected_language_version: 0.1
  startup_timeout: 5s
  compile_timeout: 5s
  max_concurrent_requests: 8

retention:
  enabled: false
  days: 30
  max_size: 0

kafka:
  brokers:
    - 127.0.0.1:9092
  topic: loza-events
  acks: all
  request_timeout: 10s
  enable_idempotence: true
  max_retries: 10
  retry_backoff: 100ms

eventbus:
  type: memory
  topic: loza.events.raw
  dlq_topic: loza.events.dlq
  consumer_group: loza-worker
  memory:
    buffer_size: 10000
  redis:
    addr: 127.0.0.1:6379
    stream: loza.events.raw
    group: loza-worker
    max_len: 1000000
  nats:
    url: nats://127.0.0.1:4222
    stream: LOZA
    subject: loza.events.raw
    durable: loza-worker
  kafka:
    brokers:
      - 127.0.0.1:9092
    topic: loza.events.raw
    consumer_group: loza-worker
    acks: all
    enable_idempotence: true
    max_retries: 3
    compression: zstd

worker:
  consumer_group: loza-worker
  poll_timeout: 2s

logging:
  level: info
  format: json

metrics:
  prometheus: true

reliability:
  mode: direct
  spool_dir: loza-spool
  spool_file: spool.ndjson
  max_spool_bytes: 10737418240
  fsync: true
  delivery_queue_size: 4096

limits:
  max_inflight_requests: 1024
  max_inflight_events: 100000
  max_queue_bytes: 268435456
  max_event_bytes: 262144
  max_attr_count: 512
  max_attr_depth: 16
  max_string_length: 16384

identity:
  mode: payload
  auth_identity_wins: true
  allow_payload_identity: true
  mtls_allowed_cns: []
  mtls_allowed_dns: []
  mtls_allowed_emails: []
  allowed_origins: []
  trusted_proxies: []

privacy:
  mode: warn
  collector_redaction: true
  emergency_redaction: false
  blocklist:
    - password
    - passwd
    - secret
    - token
    - api_key
    - apikey
    - authorization
    - cookie
    - set-cookie
    - private_key
    - access_token
    - refresh_token
    - session
  secret_scan: true

components:
  receivers:
    - loza_http
    - loza_ndjson
  processors:
    - validate
    - identity
    - redact
    - size_limit
    - dedupe
    - memory_limiter
    - cardinality_limit
  exporters:
    - duckdb
  extensions:
    - health
    - ready
    - metrics

retry:
  enabled: true
  max_attempts: 10
  initial_backoff: 100ms
  max_backoff: 30s
  jitter: true

dead_letter:
  enabled: false
  path: loza-dlq.ndjson

fanout:
  outputs: []
  delivery:
    policy: require_primary
    fallback:
      enabled: false
      on_primary_failure: false
      on_secondary_failure: false
      on_policy_failure: true
    dlq:
      on_primary_failure: true
      on_secondary_failure: false
      on_fallback_failure: true
      on_policy_failure: true

dedupe:
  enabled: false
  key: event_id
  window: 24h
  backend: memory

schema_governance:
  mode: off
  schema_version: v1
  event_version: v1
  quarantine_path: loza-quarantine.ndjson
  registry:
    - schema_version: v1
      event_version: v1
      required_fields:
        - schema_version
        - event_version
        - event_id
        - event
        - timestamp

cortex_bridge:
  enabled: false
  mode: async
  endpoint: ""
  insecure: true
  timeout: 5s
  batch_size: 128
  flush_interval: 500ms
  queue_size: 4096
  header: X-API-Key
  api_key: ""
