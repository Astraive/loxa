[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loxa"
version = "0.2.0"
description = "Python LOXA wide-event SDK"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Astraive"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["loxa*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "F401"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.setuptools.package-data]
loxa = ["py.typed"]
