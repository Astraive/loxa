name: Publish CLI

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

jobs:
  validate:
    if: inputs.component == 'cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyyaml
      - run: python scripts/release/validate-manifests.py --component cli
      - name: Run CLI tests
        run: go test ./...
        working-directory: cli
      - name: Check component tag is available
        run: python scripts/release/tag-component.py cli --dry-run

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            extension: ""
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            extension: ""
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            extension: ""
          - os: macos-14
            goos: darwin
            goarch: arm64
            extension: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            extension: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build native CLI
        shell: bash
        working-directory: cli
        env:
          OUTPUT: ../dist/loza${{ matrix.extension }}
        run: |
          mkdir -p ../dist
          CGO_ENABLED=1 go build -trimpath \
            -ldflags "-s -w -X github.com/astraive/loza/cli/internal/version.Version=${{ inputs.version }}" \
            -o "$OUTPUT" ./cmd/loza
      - name: Smoke test native CLI
        shell: bash
        working-directory: cli
        run: ../dist/loza${{ matrix.extension }} > ../dist/smoke.txt
      - name: Package native CLI
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          dist = Path("dist")
          binary = dist / f"loza{os.environ['EXTENSION']}"
          stem = f"loza_{os.environ['VERSION']}_{os.environ['GOOS']}_{os.environ['GOARCH']}"
          if os.environ["GOOS"] == "windows":
              archive = dist / f"{stem}.zip"
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as bundle:
                  bundle.write(binary, arcname=binary.name)
          else:
              archive = dist / f"{stem}.tar.gz"
              with tarfile.open(archive, "w:gz") as bundle:
                  bundle.add(binary, arcname="loza")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_suffix(archive.suffix + ".sha256").write_text(
              f"{digest}  {archive.name}\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/loza_*
      - uses: actions/upload-artifact@v4
        with:
          name: loza-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/loza_*.tar.gz
            dist/loza_*.tar.gz.sha256
            dist/loza_*.zip
            dist/loza_*.zip.sha256
          if-no-files-found: error

  publish:
    if: inputs.dry_run != true
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish CLI release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
          overwrite_files: true
      - name: Create component tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python scripts/release/tag-component.py cli --dry-run)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}"
      - name: Verify go install target
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if GOWORK=off GOPROXY=https://proxy.golang.org,direct \
              go install github.com/astraive/loza/cli/cmd/loza@v${{ inputs.version }}; then
              exit 0
            fi
            if [[ "$attempt" == "12" ]]; then
              exit 1
            fi
            sleep 10
          done
