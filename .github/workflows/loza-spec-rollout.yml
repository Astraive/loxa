name: Loza Spec Rollout

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/loza-spec-rollout.yml"
      - "docker-compose.yml"
      - "spec/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/loza-spec-rollout.yml"
      - "docker-compose.yml"
      - "spec/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r spec/requirements-service.txt

      - name: Run stager and Kafka adapter tests
        run: python -m unittest spec.tests.test_stager spec.tests.test_stager_resilience spec.tests.test_kafka_adapter

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Render Helm templates
        run: helm template loza ./spec/charts/loza --namespace loza

      - name: Build schema-service image
        run: docker build -f spec/docker/schema-service/Dockerfile -t loza-schema-service:test .

      - name: Build stager image
        run: docker build -f spec/docker/stager/Dockerfile -t loza-stager:test .
