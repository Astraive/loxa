apiVersion: apps/v1
kind: Deployment
metadata:
  name: loxa-stager
  labels:
    app.kubernetes.io/name: stager
    app.kubernetes.io/part-of: loxa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stager
      app.kubernetes.io/part-of: loxa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stager
        app.kubernetes.io/part-of: loxa
    spec:
      containers:
        - name: stager
          image: ghcr.io/astraive/loxa-stager:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: loxa-stager-config
            - secretRef:
                name: loxa-stager-secrets
                optional: true
          volumeMounts:
            - name: ingest-queue
              mountPath: /var/loxa/ingest-queue
            - name: staging
              mountPath: /var/loxa/staging
            - name: health
              mountPath: /app/health
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import os,time,pathlib,sys; p=pathlib.Path(os.environ.get("STAGER_HEARTBEAT_FILE","/app/health/stager.heartbeat"));
                  max_age=float(os.environ.get("STAGER_HEARTBEAT_MAX_AGE_SECONDS","120"));
                  sys.exit(0 if p.exists() and (time.time()-p.stat().st_mtime) <= max_age else 1)
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import os,time,pathlib,sys; p=pathlib.Path(os.environ.get("STAGER_HEARTBEAT_FILE","/app/health/stager.heartbeat"));
                  max_age=float(os.environ.get("STAGER_HEARTBEAT_MAX_AGE_SECONDS","120"));
                  sys.exit(0 if p.exists() and (time.time()-p.stat().st_mtime) <= max_age else 1)
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: ingest-queue
          emptyDir: {}
        - name: staging
          emptyDir: {}
        - name: health
          emptyDir: {}
