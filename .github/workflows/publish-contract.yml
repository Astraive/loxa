name: Publish Loxa Contract

on:
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  publish-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r loxa-spec/requirements.txt || true
          pip install boto3 || true

      - name: Generate contract
        run: |
          python loxa-spec/codegen/generate.py

      - name: Publish registry artifact
        env:
          LOXA_CONTRACT_BUCKET: ${{ secrets.LOXA_CONTRACT_BUCKET }}
          LOXA_CONTRACT_PREFIX: ${{ secrets.LOXA_CONTRACT_PREFIX }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          python loxa-spec/scripts/publish_contract.py
          python loxa-spec/scripts/publish_contract_s3.py
