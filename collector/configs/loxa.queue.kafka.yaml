collector:
  addr: ":9090"
kafka:
  brokers:
    - "127.0.0.1:9092"
  topic: "loxa-events"
  acks: "all"
  request_timeout: 10s
  enable_idempotence: true
  max_retries: 10
  retry_backoff: 100ms
worker:
  consumer_group: "loxa-worker"
reliability:
  mode: "queue"
dedupe:
  enabled: true
  key: event_id
  window: 24h
  backend: redis
  redis_addr: "127.0.0.1:6379"
  redis_prefix: "loxa:dedupe:"
